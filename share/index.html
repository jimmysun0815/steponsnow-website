<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逐风 - 滑雪拼车拼房</title>
    <meta name="description" content="逐风App - 你的每一步，风都会记得。滑雪拼车拼房信息平台。">
    
    <!-- Open Graph / 微信分享 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://steponsnow.com/share/">
    <meta property="og:title" content="逐风 - 滑雪拼车拼房">
    <meta property="og:description" content="发现滑雪拼车拼房信息，一起去滑雪！">
    <meta property="og:image" content="https://steponsnow.com/share/logo.png">
    
    <!-- App Store / Google Play 链接 -->
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_STORE_ID">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.3);
        }
        
        .app-name {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #8B5CF6, #6366F1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
        }
        
        .card {
            background: rgba(42, 49, 66, 0.9);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 16px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-top-color: #8B5CF6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .info-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.6;
        }
        
        .download-section {
            margin-top: 32px;
        }
        
        .download-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .download-btn.ios {
            background: linear-gradient(135deg, #8B5CF6, #6366F1);
            color: white;
        }
        
        .download-btn.android {
            background: rgba(16, 185, 129, 0.2);
            color: #10B981;
            border: 1px solid #10B981;
        }
        
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
        
        .download-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 32px;
        }
        
        .feature {
            text-align: center;
        }
        
        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .feature-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
        
        /* 动态内容区域 */
        #content-preview {
            display: none;
        }
        
        #content-preview.show {
            display: block;
        }
        
        .content-type {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(139, 92, 246, 0.2);
            color: #8B5CF6;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 16px;
        }
        
        .content-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .content-info {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
        }
        
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        
        .info-row:last-child {
            margin-bottom: 0;
        }
        
        .info-icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .open-app-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8B5CF6, #6366F1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .open-app-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/share/logo.png" alt="逐风" class="logo" onerror="this.style.display='none'">
        <h1 class="app-name">逐风</h1>
        <p class="tagline">你的每一步，风都会记得</p>
        
        <div class="card">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span>正在打开 App...</span>
            </div>
            
            <div id="content-preview">
                <div class="content-type" id="content-type">
                    <span id="content-type-icon">🚗</span>
                    <span id="content-type-text">拼车信息</span>
                </div>
                <div class="content-info" id="content-info">
                    <!-- 动态填充内容 -->
                </div>
            </div>
            
            <p class="info-text" id="info-text">
                如果 App 没有自动打开，请点击下方按钮手动打开或下载 App
            </p>
            
            <button class="open-app-btn" id="open-app-btn" onclick="openApp()">
                在 App 中查看
            </button>
        </div>
        
        <div class="download-section">
            <h2 class="download-title">下载逐风 App</h2>
            <div class="download-buttons">
                <a href="https://apps.apple.com/us/app/%E9%80%90%E9%A3%8E/id6754859759" class="download-btn ios" id="ios-download">
                    <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    App Store
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.steponsnow.snowapp" class="download-btn android" id="android-download">
                    <svg viewBox="0 0 24 24"><path d="M3 20.5v-17c0-.59.34-1.11.84-1.35L13.69 12l-9.85 9.85c-.5-.24-.84-.76-.84-1.35zm13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27zm3.35-4.31c.34.27.84.27 1.15 0l-1.15-1.14-2.27 2.27 2.27 2.27zm-3.35-4.31l10.76 6.22L6.05 2.66l10.76 6.22z"/></svg>
                    Google Play
                </a>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎿</div>
                <div class="feature-text">滑雪记录</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🚗</div>
                <div class="feature-text">拼车出行</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🏠</div>
                <div class="feature-text">拼房住宿</div>
            </div>
        </div>
        
        <div class="footer">
            © 2024 逐风 StepOnSnow. All rights reserved.
        </div>
    </div>
    
    <script>
        // 解析 URL 获取类型和 ID
        const pathParts = window.location.pathname.split('/').filter(p => p);
        // 路径格式: /share/{type}/{id}
        const type = pathParts[1]; // 'carpool' 或 'accommodation'
        const id = pathParts[2];   // UUID
        
        // 构建 App Scheme URL
        function getAppUrl() {
            if (type && id) {
                return `steponsnow://${type}/${id}`;
            }
            return 'steponsnow://';
        }
        
        // 构建 Universal Link URL
        function getUniversalLink() {
            return window.location.href;
        }
        
        // 检测设备类型
        function getDeviceType() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return 'ios';
            }
            if (/android/i.test(userAgent)) {
                return 'android';
            }
            return 'other';
        }
        
        // 尝试打开 App
        function openApp() {
            const deviceType = getDeviceType();
            const appUrl = getAppUrl();
            
            // 记录开始时间
            const start = Date.now();
            
            // 创建隐藏的 iframe 尝试打开 App
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = appUrl;
            document.body.appendChild(iframe);
            
            // 同时尝试使用 location.href
            setTimeout(() => {
                window.location.href = appUrl;
            }, 100);
            
            // 如果 2.5 秒后页面还在，说明 App 没有安装
            setTimeout(() => {
                const elapsed = Date.now() - start;
                if (elapsed < 3000) {
                    // App 没有安装，跳转到应用商店
                    if (deviceType === 'ios') {
                        window.location.href = document.getElementById('ios-download').href;
                    } else if (deviceType === 'android') {
                        window.location.href = document.getElementById('android-download').href;
                    }
                }
            }, 2500);
        }
        
        // 更新内容类型显示
        function updateContentType() {
            const contentTypeEl = document.getElementById('content-type');
            const contentTypeIcon = document.getElementById('content-type-icon');
            const contentTypeText = document.getElementById('content-type-text');
            const contentPreview = document.getElementById('content-preview');
            
            if (type === 'carpool') {
                contentTypeIcon.textContent = '🚗';
                contentTypeText.textContent = '拼车信息';
                contentPreview.classList.add('show');
            } else if (type === 'accommodation') {
                contentTypeIcon.textContent = '🏠';
                contentTypeText.textContent = '拼房信息';
                contentPreview.classList.add('show');
            }
        }
        
        // 页面加载完成后自动尝试打开 App
        window.onload = function() {
            updateContentType();
            
            // 延迟一点点再尝试打开，让用户看到页面
            setTimeout(() => {
                // 隐藏 loading
                document.getElementById('loading').style.display = 'none';
                
                // 自动尝试打开 App
                openApp();
            }, 1000);
        };
    </script>
</body>
</html>
