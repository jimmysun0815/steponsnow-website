<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证中... - 逐风 Step On</title>
    <link rel="icon" type="image/jpeg" href="assets/logo-1024x1024.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0A0E1A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 20px;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .message {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: rgba(34, 197, 94, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .error-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #fff;
            color: #0A0E1A;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            margin-left: 12px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .hidden {
            display: none;
        }

        .info-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="assets/logo-1024x1024.jpg" alt="逐风 Logo">
        </div>

        <!-- 加载中状态 -->
        <div id="loading-state">
            <div class="spinner"></div>
            <h1>验证中...</h1>
            <p class="message">正在处理您的请求，请稍候</p>
        </div>

        <!-- 成功状态（移动端） -->
        <div id="success-mobile" class="hidden">
            <div class="success-icon">✓</div>
            <h1>验证成功！</h1>
            <p class="message">正在跳转到 App...</p>
            <div class="info-box">
                如果没有自动跳转，请手动打开逐风 App
            </div>
        </div>

        <!-- 成功状态（桌面端） -->
        <div id="success-desktop" class="hidden">
            <div class="success-icon">✓</div>
            <h1>验证成功！</h1>
            <p class="message">您的邮箱已验证成功，现在可以在手机上登录逐风 App 了</p>
            <div class="info-box">
                📱 请在手机上下载并打开逐风 App 完成登录
            </div>
            <a href="/" class="btn">返回首页</a>
        </div>

        <!-- 错误状态 -->
        <div id="error-state" class="hidden">
            <div class="error-icon">✕</div>
            <h1>验证失败</h1>
            <p class="message" id="error-message">验证链接可能已过期或无效</p>
            <div class="info-box">
                请返回 App 重新发送验证邮件，或联系客服获取帮助
            </div>
            <a href="/" class="btn">返回首页</a>
        </div>
    </div>

    <script type="module">
        // Supabase 配置
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        const SUPABASE_URL = 'https://avztlsrmiqigeivtmwha.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2enRsc3JtaXFpZ2VpdnRtd2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE4NDg3ODksImV4cCI6MjA3NzQyNDc4OX0.yi6LQfbhRLcb1ZykoIUXKbWnadwwSsLVlOWjaPAbAlE';
        
        // 根据 Supabase 官方文档的推荐配置
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                flowType: 'pkce',
                autoRefreshToken: true,
                detectSessionInUrl: true,  // 关键：自动检测 URL 中的 auth 参数
                persistSession: false      // 网页端不持久化
            }
        });

        // 检测是否为移动设备
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // 从 URL 获取 hash fragments
        function getHashParams() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return {
                access_token: params.get('access_token'),
                refresh_token: params.get('refresh_token'),
                type: params.get('type'),
                error: params.get('error'),
                error_description: params.get('error_description')
            };
        }

        // 从 URL 获取 query parameters
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                token_hash: params.get('token_hash'),
                code: params.get('code'),
                type: params.get('type'),
                error: params.get('error'),
                error_description: params.get('error_description')
            };
        }

        // App Deep Link
        const APP_SCHEME = 'steponsnow://auth-callback';

        // 超时保护：10秒后如果还在验证中，显示错误
        let timeoutId = setTimeout(() => {
            const loadingState = document.getElementById('loading-state');
            if (loadingState && !loadingState.classList.contains('hidden')) {
                console.error('❌ 验证超时');
                showError('验证超时。请检查：\n1. 网络连接是否正常\n2. 验证链接是否有效\n3. 尝试重新点击邮件中的链接');
            }
        }, 10000);

        async function handleAuthCallback() {
            const hashParams = getHashParams();
            const queryParams = getQueryParams();
            const isMobile = isMobileDevice();

            console.log('🔍 开始处理 Auth Callback');
            console.log('Hash params:', hashParams);
            console.log('Query params:', queryParams);
            console.log('Is mobile:', isMobile);
            console.log('Full URL:', window.location.href);
            
            // 清除超时定时器
            if (timeoutId) {
                clearTimeout(timeoutId);
            }

            // 检查是否有错误
            if (hashParams.error || queryParams.error) {
                const errorMsg = hashParams.error_description || queryParams.error_description || hashParams.error || queryParams.error;
                console.error('❌ URL 中包含错误:', errorMsg);
                showError(errorMsg);
                return;
            }

            // 检查 URL 中是否有任何认证相关参数
            const hasAuthParams = 
                hashParams.access_token || 
                queryParams.token_hash || 
                queryParams.code ||
                hashParams.refresh_token;

            if (!hasAuthParams) {
                console.warn('⚠️ URL 中没有找到任何认证参数');
                console.log('这可能是因为：');
                console.log('1. Supabase 返回了 403 错误');
                console.log('2. Redirect URL 配置不正确');
                console.log('3. 邮件链接已过期或已使用');
                
                // 显示友好的错误消息
                showError('验证链接无效或已过期。请确保：\n1. 从最新的验证邮件点击\n2. 链接未被多次点击\n3. 如仍有问题，请重新发送验证邮件');
                return;
            }

            // 情况1：Hash fragment 格式（标准的 access_token）
            if (hashParams.access_token) {
                console.log('✅ 检测到 hash fragment 格式的 tokens');
                handleSuccessWithTokens(hashParams, isMobile);
                return;
            }

            // 情况2：Query parameter 格式（token_hash）
            if (queryParams.token_hash) {
                console.log('✅ 检测到 token_hash 格式');
                await handleTokenHash(queryParams.token_hash, queryParams.type, isMobile);
                return;
            }

            // 情况3：PKCE code 格式（来自 Supabase 验证邮件）
            if (queryParams.code) {
                console.log('✅ 检测到 PKCE code 格式');
                await handlePKCECallback(isMobile);
                return;
            }

            // 没有找到任何验证信息
            console.error('❌ 未找到任何有效的验证信息');
            showError('未找到验证信息，请重新点击邮件中的链接');
        }

        // 处理 PKCE 回调（Supabase 邮件验证）
        async function handlePKCECallback(isMobile) {
            try {
                console.log('正在处理 PKCE 验证回调...');
                console.log('📱 isMobile:', isMobile);
                console.log('当前 URL:', window.location.href);
                
                // 获取 URL 中的所有参数
                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');
                const error = urlParams.get('error');
                const errorDescription = urlParams.get('error_description');
                
                // 检查是否有错误
                if (error) {
                    console.error('❌ Supabase 返回错误:', error, errorDescription);
                    showError(errorDescription || error);
                    return;
                }
                
                // 检查是否有 code
                if (!code) {
                    console.error('❌ URL 中没有 code 参数');
                    showError('验证链接格式不正确');
                    return;
                }
                
                console.log('✅ 检测到 code 参数:', code.substring(0, 20) + '...');
                
                if (isMobile) {
                    console.log('📱 移动端：直接传递 code 给 App');
                    showSuccess('mobile');
                    
                    // 直接把完整的 query string 传递给 App
                    // 让 App 的 Supabase SDK 处理 PKCE 流程
                    const deepLink = `${APP_SCHEME}?${window.location.search.substring(1)}`;
                    
                    console.log('🔗 Deep Link (with code):', deepLink.replace(code, code.substring(0, 20) + '...'));
                    console.log('⏱️ 1秒后将尝试打开 App...');
                    
                    setTimeout(() => {
                        console.log('🚀 执行跳转');
                        window.location.href = deepLink;
                    }, 1000);

                    // 3秒后显示提示
                    setTimeout(() => {
                        const infoBox = document.querySelector('#success-mobile .info-box');
                        if (infoBox) {
                            infoBox.innerHTML = `
                                未自动打开 App？<br>
                                <strong>验证已完成</strong>，请手动打开 App 并登录
                            `;
                        }
                    }, 3000);
                } else {
                    console.log('💻 桌面端：尝试在网页端完成验证');
                    
                    // 桌面端：尝试让 Supabase SDK 处理
                    const { data, error: sessionError } = await supabase.auth.getSession();
                    
                    if (sessionError) {
                        console.error('❌ 获取 session 失败:', sessionError);
                        showError('验证失败：' + sessionError.message);
                        return;
                    }
                    
                    if (data.session) {
                        console.log('✅ 桌面端验证成功');
                        showVerificationComplete('desktop');
                    } else {
                        console.log('⚠️ 桌面端没有获取到 session');
                        showVerificationComplete('desktop');
                    }
                }
                
            } catch (e) {
                console.error('PKCE 验证过程出错:', e);
                
                // 即使出错，移动端也尝试打开 App
                if (isMobile) {
                    console.log('⚠️ 出错但仍尝试打开 App');
                    showSuccess('mobile');
                    
                    setTimeout(() => {
                        window.location.href = `${APP_SCHEME}`;
                    }, 1000);
                } else {
                    showVerificationComplete('desktop');
                }
            }
        }

        // 显示验证完成消息
        function showVerificationComplete(platform) {
            // 清除超时定时器
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            
            document.getElementById('loading-state').classList.add('hidden');
            if (platform === 'mobile') {
                document.getElementById('success-mobile').classList.remove('hidden');
                // 修改文案
                const mobileMsg = document.querySelector('#success-mobile .message');
                if (mobileMsg) {
                    mobileMsg.textContent = '邮箱验证已完成！现在可以登录 App 了';
                }
            } else {
                document.getElementById('success-desktop').classList.remove('hidden');
                // 修改文案
                const desktopMsg = document.querySelector('#success-desktop .message');
                if (desktopMsg) {
                    desktopMsg.textContent = '邮箱验证已完成！请在手机上打开 App 并登录';
                }
            }
        }

        // 处理 token_hash 验证
        async function handleTokenHash(tokenHash, type, isMobile) {
            try {
                console.log('正在使用 token_hash 验证...');
                
                // 使用 Supabase 验证 token_hash
                const { data, error } = await supabase.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: type || 'signup'
                });

                if (error) {
                    console.error('验证失败:', error);
                    showError(error.message || '验证失败，链接可能已过期');
                    return;
                }

                if (data.session) {
                    console.log('验证成功！');
                    handleSuccessWithTokens({
                        access_token: data.session.access_token,
                        refresh_token: data.session.refresh_token,
                        type: type || 'signup'
                    }, isMobile);
                } else {
                    showError('验证失败，未获取到会话信息');
                }
            } catch (e) {
                console.error('验证过程出错:', e);
                showError('验证过程出错：' + e.message);
            }
        }

        // 处理成功的验证
        function handleSuccessWithTokens(params, isMobile) {
            console.log('🎉 handleSuccessWithTokens 被调用');
            console.log('📱 isMobile:', isMobile);
            console.log('🔑 Tokens:', {
                access_token: params.access_token ? '存在' : '缺失',
                refresh_token: params.refresh_token ? '存在' : '缺失',
                type: params.type
            });
            
            if (isMobile) {
                // 移动设备：尝试跳转到 App
                console.log('📱 检测到移动设备，准备跳转到 App');
                showSuccess('mobile');
                
                // 构建 deep link
                const deepLink = `${APP_SCHEME}#access_token=${params.access_token}&refresh_token=${params.refresh_token}&type=${params.type}`;
                
                console.log('🔗 Deep Link:', deepLink);
                console.log('⏱️ 1秒后将尝试打开 App...');
                
                // 尝试打开 App
                setTimeout(() => {
                    console.log('🚀 执行跳转: window.location.href =', deepLink);
                    window.location.href = deepLink;
                }, 1000);

                // 如果 App 没有打开，3秒后显示提示
                setTimeout(() => {
                    console.log('⏱️ 3秒后检查是否需要显示下载提示');
                    const infoBox = document.querySelector('#success-mobile .info-box');
                    if (infoBox) {
                        console.log('📝 更新提示信息');
                        infoBox.innerHTML = `
                            未检测到 App？<br>
                            <a href="/" style="color: #60a5fa; text-decoration: underline;">点击下载逐风 App</a>
                        `;
                    }
                }, 3000);
            } else {
                // 桌面端：显示成功消息
                console.log('💻 检测到桌面设备，显示成功消息');
                showSuccess('desktop');
            }
        }

        function showSuccess(platform) {
            // 清除超时定时器
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            
            document.getElementById('loading-state').classList.add('hidden');
            if (platform === 'mobile') {
                document.getElementById('success-mobile').classList.remove('hidden');
            } else {
                document.getElementById('success-desktop').classList.remove('hidden');
            }
        }

        function showError(message) {
            // 清除超时定时器
            if (timeoutId) {
                clearTimeout(timeoutId);
            }
            
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }

        // 页面加载时执行
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📄 页面加载完成');
            console.log('🔗 当前 URL:', window.location.href);
            console.log('🔗 Hash:', window.location.hash);
            console.log('🔗 Search:', window.location.search);
            
            // 延迟一点执行，让加载动画显示出来
            setTimeout(() => {
                try {
                    handleAuthCallback();
                } catch (error) {
                    console.error('❌ handleAuthCallback 执行出错:', error);
                    showError('验证过程出错：' + error.message);
                }
            }, 500);
        });
        
        // 捕获未处理的错误
        window.addEventListener('error', (event) => {
            console.error('❌ 全局错误:', event.error);
            showError('页面加载出错：' + event.error?.message);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('❌ Promise 错误:', event.reason);
            showError('异步处理出错：' + event.reason?.message);
        });
    </script>
</body>
</html>
