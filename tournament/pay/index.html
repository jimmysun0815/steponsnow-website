<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>锦标赛报名支付 - 逐风 Step On</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-1024x1024.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0A0E1A 0%, #1E293B 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #fff; padding: 24px;
    }
    .card {
      background: #1A1F2E; border-radius: 20px; padding: 40px 28px; max-width: 420px;
      width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { color: #A0AEC0; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
    .spinner {
      width: 40px; height: 40px; margin: 24px auto; border: 3px solid rgba(34,197,94,.2);
      border-top-color: #22C55E; border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block; margin-top: 20px; padding: 14px 28px; border-radius: 12px;
      background: #22C55E; color: #fff; font-weight: 700; text-decoration: none; border: none;
      font-size: 15px; cursor: pointer;
    }
    .err { color: #F87171; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🏆</div>
    <h1 id="title">正在跳转到安全支付…</h1>
    <div class="spinner" id="spinner"></div>
    <p id="msg">请稍候，正在为你创建支付订单。</p>
    <a class="btn hidden" id="retry" href="#">重试</a>
  </div>

  <script>
    // Edge Function 白名单（写死两套，不接受 URL 传入任意 api 地址，防伪造）
    const FN = {
      prod: "https://jbucqclsoqcjvnefiyyw.supabase.co/functions/v1",
      dev:  "https://avztlsrmiqigeivtmwha.supabase.co/functions/v1",
    };
    // 按【当前域名】自动选后端：同一份代码部署到两个 bucket，各自连各自的后端。
    //   dev.steponsnow.com / localhost → Dev 项目 + test Stripe
    //   steponsnow.com                 → Prod 项目 + live Stripe
    const IS_DEV = location.hostname.startsWith("dev.") ||
                   location.hostname === "localhost" ||
                   location.hostname === "127.0.0.1";
    const base = FN[IS_DEV ? "dev" : "prod"];
    const q = new URLSearchParams(location.search);
    const token = q.get("token");

    function fail(text) {
      document.getElementById("title").textContent = "无法发起支付";
      document.getElementById("spinner").classList.add("hidden");
      const m = document.getElementById("msg");
      m.textContent = text; m.classList.add("err");
      const r = document.getElementById("retry");
      r.classList.remove("hidden");
      r.onclick = (e) => { e.preventDefault(); location.reload(); };
    }

    async function go() {
      if (!token) return fail("链接无效：缺少支付凭证。请回到 App 重新点击报名。");
      try {
        const res = await fetch(`${base}/create-checkout`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token }),
        });
        const data = await res.json();
        if (res.ok && data.url) { location.href = data.url; return; }
        if (data.already_paid && data.success_url) { location.href = data.success_url; return; }
        const map = {
          expired: "支付链接已过期（30 分钟有效）。请回到 App 重新点击报名。",
          bad_signature: "链接校验失败，请勿手动修改链接。",
          registration_closed: "该锦标赛报名已截止。",
          tournament_full: "该锦标赛名额已满。",
        };
        fail(map[data.error] || ("发起支付失败：" + (data.error || res.status)));
      } catch (e) {
        fail("网络错误，请检查网络后重试。");
      }
    }
    go();
  </script>
</body>
</html>
