<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付未完成 - 逐风 Step On</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-1024x1024.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0A0E1A 0%, #1E293B 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #fff; padding: 24px;
    }
    .card {
      background: #1A1F2E; border-radius: 20px; padding: 40px 28px; max-width: 420px;
      width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { color: #A0AEC0; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
    .btn {
      display: inline-block; margin-top: 24px; padding: 15px 32px; border-radius: 12px;
      background: #334155; color: #fff; font-weight: 700; text-decoration: none; font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🛑</div>
    <h1>支付未完成</h1>
    <p>你取消了支付，报名尚未生效。</p>
    <p>可以回到 App 重新报名，名额保留至报名截止。</p>
    <a class="btn" id="back" href="#">返回 App</a>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const t = q.get("t");
    document.getElementById("back").href = t ? `steponsnow://tournament/${t}` : "steponsnow://tournament";
  </script>
</body>
</html>
