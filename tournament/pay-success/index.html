<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报名成功 - 逐风 Step On</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-1024x1024.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0A0E1A 0%, #1E293B 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #fff; padding: 24px;
    }
    .card {
      background: #1A1F2E; border-radius: 20px; padding: 40px 28px; max-width: 420px;
      width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .check {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
      background: #22C55E; display: flex; align-items: center; justify-content: center; font-size: 40px;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #A0AEC0; font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
    .btn {
      display: inline-block; margin-top: 24px; padding: 15px 32px; border-radius: 12px;
      background: #22C55E; color: #fff; font-weight: 700; text-decoration: none; font-size: 16px;
    }
    .hint { margin-top: 16px; font-size: 12px; color: #64748B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>报名支付成功</h1>
    <p>你的锦标赛报名费已支付成功。</p>
    <p>正在返回 App，如未自动跳转请点击下方按钮。</p>
    <a class="btn" id="back" href="#">返回 App</a>
    <div class="hint">若按钮无效，请手动打开逐风 App 查看你的锦标赛。</div>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const t = q.get("t");
    // 精确回到那个锦标赛详情页；?paid=1 供 App 弹成功提示
    const deep = t ? `steponsnow://tournament/${t}?paid=1` : "steponsnow://tournament";
    document.getElementById("back").href = deep;
    // 尝试自动跳转（部分浏览器需用户手势，失败则用户点按钮）
    setTimeout(() => { location.href = deep; }, 600);
  </script>
</body>
</html>
